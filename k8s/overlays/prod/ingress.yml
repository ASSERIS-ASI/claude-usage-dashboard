apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: claude-app
  labels:
    app.kubernetes.io/name: claude-usage-dashboard
    app.kubernetes.io/component: dashboard
spec:
  ingressClassName: nginx
  rules:
    - host: claude-usage.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: claude-app
                port:
                  name: http
