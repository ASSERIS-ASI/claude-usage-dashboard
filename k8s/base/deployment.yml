apiVersion: apps/v1
kind: Deployment
metadata:
  name: claude-app
  labels:
    app.kubernetes.io/name: claude-usage-dashboard
    app.kubernetes.io/component: dashboard
spec:
  progressDeadlineSeconds: 180
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: claude-usage-dashboard
      app.kubernetes.io/component: dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: claude-usage-dashboard
        app.kubernetes.io/component: dashboard
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashboard
          image: ghcr.io/asseris-asi/claude-usage-dashboard:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3333
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: CLAUDE_USAGE_HOST
              value: 0.0.0.0
            - name: CLAUDE_USAGE_STATE_DIR
              value: /data/state
            - name: CLAUDE_CONFIG_DIR
              value: /data/claude
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: state
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: claude-usage-dashboard-state
        - name: tmp
          emptyDir: {}
