<!--
@asseris-module       Security Section
@asseris-description  Auto-annotated module metadata for tpl/sections/security-section.html.
@asseris-pillar       actuator
@asseris-domain       dashboard-ui
@asseris-stage        output

<details class="forensic-details section-surface-hidden" id="security-postures-collapse" data-span="12" open>
<summary class="forensic-summary forensic-summary--bar">
<div class="forensic-summary-row">
<p id="security-postures-summary" class="forensic-summary-metrics">Security Postures</p>
</div>
</summary>
<div class="forensic-inner" style="padding-top:12px">
<div class="grid" id="security-postures-kpis" style="grid-template-columns:repeat(4,1fr)!important"></div>
<div style="display:grid;grid-template-columns:2fr 1fr;gap:12px;align-items:stretch">
<!-- Left column: Timeline + Categories -->
<div style="display:flex;flex-direction:column;gap:12px">
<div class="chart-box" style="flex:0 0 auto"><h3 id="sec-timeline-h3"></h3><div id="c-sec-timeline" style="width:100%;height:280px"></div></div>
<div class="chart-box" style="flex:0 0 auto"><h3 id="sec-categories-h3"></h3><div id="c-sec-categories" style="width:100%;height:280px"></div></div>
</div>
<!-- Right column: DataTable stretches to match left -->
<div class="chart-box" style="display:flex;flex-direction:column;overflow:hidden">
<h3 id="sec-events-h3"></h3>
<div id="sec-events-table-host" style="flex:1;overflow-y:auto"></div>
</div>
</div>
<div class="chart-box" style="margin-top:12px"><h3 id="sec-heatmap-h3"></h3><div id="c-sec-heatmap" style="width:100%;height:280px"></div></div>
</div>
</details>
